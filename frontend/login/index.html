<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Placement Arena - Authentication</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
        }
        .card-light {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            box-shadow: 0 20px 50px rgba(79, 70, 229, 0.07);
        }
        .gradient-text {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .btn-primary {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            transition: all 0.25s ease;
        }
        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 20px -3px rgba(79, 70, 229, 0.3);
        }
        .spinner {
            border: 3px solid rgba(255,255,255,0.4);
            border-radius: 50%;
            border-top: 3px solid #fff;
            width: 20px;
            height: 20px;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="min-h-screen bg-slate-50 flex items-center justify-center p-4">

    <!-- Subtle Background Ambient Light Blobs -->
    <div class="fixed top-0 left-0 w-full h-full overflow-hidden -z-10 pointer-events-none">
        <div class="absolute top-[-10%] left-[-10%] w-[500px] h-[500px] bg-indigo-100/60 rounded-full blur-[120px]"></div>
        <div class="absolute bottom-[-10%] right-[-10%] w-[500px] h-[500px] bg-purple-100/60 rounded-full blur-[120px]"></div>
    </div>

    <div class="card-light w-full max-w-md rounded-3xl p-8 md:p-10 relative z-10">
        <div class="text-center mb-6">
            <a href="/dashboard/index.html" class="inline-flex items-center justify-center w-14 h-14 bg-indigo-50 text-indigo-600 rounded-2xl mb-4 font-extrabold text-2xl shadow-sm border border-indigo-100 transition hover:scale-105">
                ⚡
            </a>
            <h1 class="text-3xl font-extrabold tracking-tight mb-2 text-slate-900">
                Placement <span class="gradient-text">Arena</span>
            </h1>
            <p class="text-slate-500 text-sm font-medium">Daily Placement Mock Assessment Platform</p>
        </div>

        <!-- Auth Tabs Toggle -->
        <div class="flex bg-slate-100 p-1.5 rounded-2xl mb-6">
            <button id="tab-login" onclick="switchAuthTab('login')" class="flex-1 py-2.5 rounded-xl font-bold text-xs transition bg-white text-indigo-600 shadow-sm">
                Sign In
            </button>
            <button id="tab-signup" onclick="switchAuthTab('signup')" class="flex-1 py-2.5 rounded-xl font-bold text-xs transition text-slate-600 hover:text-slate-900">
                Request Account (Sign Up)
            </button>
        </div>

        <!-- Feedback Messages -->
        <div id="error-msg" class="hidden bg-rose-50 border border-rose-200 text-rose-600 p-3.5 rounded-xl text-sm mb-6 text-center font-medium"></div>
        <div id="success-msg" class="hidden bg-emerald-50 border border-emerald-200 text-emerald-700 p-3.5 rounded-xl text-sm mb-6 text-center font-medium"></div>

        <!-- Login Form -->
        <form id="login-form" class="space-y-5" onsubmit="handleLogin(event)">
            <div>
                <label for="username" class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">Username</label>
                <input type="text" id="username" required
                    class="w-full bg-slate-50/70 border border-slate-200 rounded-xl px-4 py-3 text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all text-sm font-medium"
                    placeholder="Enter your username">
            </div>

            <div>
                <label for="password" class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">Password</label>
                <div class="relative">
                    <input type="password" id="password" required
                        class="w-full bg-slate-50/70 border border-slate-200 rounded-xl px-4 py-3 text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all text-sm font-medium"
                        placeholder="••••••••">
                    <button type="button" onclick="togglePassword('password')" class="absolute right-3.5 top-3.5 text-slate-400 hover:text-slate-600 transition-colors">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    </button>
                </div>
            </div>

            <button type="submit" id="login-btn" class="w-full btn-primary text-white font-bold py-3.5 rounded-xl flex items-center justify-center gap-2 mt-4 text-sm shadow-md">
                <span>Sign In</span>
                <div id="loading-spinner" class="spinner hidden"></div>
            </button>
        </form>

        <!-- Sign Up Form -->
        <form id="signup-form" class="space-y-4 hidden" onsubmit="handleSignUp(event)">
            <div>
                <label for="su-username" class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Username *</label>
                <input type="text" id="su-username" required
                    class="w-full bg-slate-50/70 border border-slate-200 rounded-xl px-4 py-2.5 text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all text-sm font-medium"
                    placeholder="Choose a username">
            </div>

            <div>
                <label for="su-display-name" class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Full Name</label>
                <input type="text" id="su-display-name"
                    class="w-full bg-slate-50/70 border border-slate-200 rounded-xl px-4 py-2.5 text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all text-sm font-medium"
                    placeholder="Your full name (optional)">
            </div>

            <div>
                <label for="su-email" class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Email Address</label>
                <input type="email" id="su-email"
                    class="w-full bg-slate-50/70 border border-slate-200 rounded-xl px-4 py-2.5 text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all text-sm font-medium"
                    placeholder="user@example.com (optional)">
            </div>

            <div>
                <label for="su-password" class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Password *</label>
                <div class="relative">
                    <input type="password" id="su-password" required
                        class="w-full bg-slate-50/70 border border-slate-200 rounded-xl px-4 py-2.5 text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all text-sm font-medium"
                        placeholder="Choose a strong password">
                    <button type="button" onclick="togglePassword('su-password')" class="absolute right-3.5 top-3 text-slate-400 hover:text-slate-600 transition-colors">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    </button>
                </div>
            </div>

            <div class="p-3 bg-amber-50 border border-amber-200 rounded-xl text-xs text-amber-800 leading-relaxed font-medium">
                ⏱️ <strong>Admin Approval Required:</strong> Your sign-up request will be submitted to the Admin Panel for confirmation. Requests expire automatically after <strong>24 hours</strong> if not approved.
            </div>

            <button type="submit" id="signup-btn" class="w-full btn-primary text-white font-bold py-3.5 rounded-xl flex items-center justify-center gap-2 mt-4 text-sm shadow-md">
                <span>Submit Registration Request</span>
                <div id="su-spinner" class="spinner hidden"></div>
            </button>
        </form>

        <div class="mt-6 text-center">
            <a href="/dashboard/index.html" class="text-xs text-slate-500 hover:text-indigo-600 font-semibold transition">
                ← Back to Dashboard Landing Page
            </a>
        </div>
    </div>

    <script>
        const API = window.location.origin + '/api';

        function togglePassword(inputId) {
            const pwd = document.getElementById(inputId);
            if (pwd) {
                const type = pwd.getAttribute('type') === 'password' ? 'text' : 'password';
                pwd.setAttribute('type', type);
            }
        }

        function switchAuthTab(tab) {
            const loginBtn = document.getElementById('tab-login');
            const signupBtn = document.getElementById('tab-signup');
            const loginForm = document.getElementById('login-form');
            const signupForm = document.getElementById('signup-form');
            const errorMsg = document.getElementById('error-msg');
            const successMsg = document.getElementById('success-msg');

            errorMsg.classList.add('hidden');
            successMsg.classList.add('hidden');

            if (tab === 'signup') {
                loginBtn.className = 'flex-1 py-2.5 rounded-xl font-bold text-xs transition text-slate-600 hover:text-slate-900';
                signupBtn.className = 'flex-1 py-2.5 rounded-xl font-bold text-xs transition bg-white text-indigo-600 shadow-sm';
                loginForm.classList.add('hidden');
                signupForm.classList.remove('hidden');
            } else {
                signupBtn.className = 'flex-1 py-2.5 rounded-xl font-bold text-xs transition text-slate-600 hover:text-slate-900';
                loginBtn.className = 'flex-1 py-2.5 rounded-xl font-bold text-xs transition bg-white text-indigo-600 shadow-sm';
                signupForm.classList.add('hidden');
                loginForm.classList.remove('hidden');
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('login-btn');
            const spinner = document.getElementById('loading-spinner');
            const errorMsg = document.getElementById('error-msg');
            const successMsg = document.getElementById('success-msg');
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            btn.disabled = true;
            spinner.classList.remove('hidden');
            errorMsg.classList.add('hidden');
            successMsg.classList.add('hidden');

            try {
                const response = await axios.post(`${API}/auth/login/`, { username, password });
                const { access, refresh, user } = response.data;
                
                localStorage.setItem('access_token', access);
                localStorage.setItem('refresh_token', refresh);
                localStorage.setItem('user_info', JSON.stringify({
                    id: user.id,
                    username: user.username,
                    display_name: user.display_name || user.first_name || user.username,
                    role: user.role
                }));

                if (user.role === 'admin') {
                    window.location.href = '/panel/index.html';
                } else {
                    window.location.href = '/dashboard/index.html';
                }
            } catch (error) {
                errorMsg.classList.remove('hidden');
                errorMsg.textContent = error.response?.data?.non_field_errors?.[0] || error.response?.data?.error || 'Login failed. Please check credentials.';
            } finally {
                btn.disabled = false;
                spinner.classList.add('hidden');
            }
        }

        async function handleSignUp(e) {
            e.preventDefault();
            const btn = document.getElementById('signup-btn');
            const spinner = document.getElementById('su-spinner');
            const errorMsg = document.getElementById('error-msg');
            const successMsg = document.getElementById('success-msg');

            const username = document.getElementById('su-username').value.trim();
            const display_name = document.getElementById('su-display-name').value.trim();
            const email = document.getElementById('su-email').value.trim();
            const password = document.getElementById('su-password').value;

            btn.disabled = true;
            spinner.classList.remove('hidden');
            errorMsg.classList.add('hidden');
            successMsg.classList.add('hidden');

            try {
                const response = await axios.post(`${API}/auth/signup/`, {
                    username, password, display_name, email
                });
                
                successMsg.classList.remove('hidden');
                successMsg.innerHTML = `🎉 <strong>Request Submitted!</strong> ${response.data.message}`;
                
                document.getElementById('su-username').value = '';
                document.getElementById('su-display-name').value = '';
                document.getElementById('su-email').value = '';
                document.getElementById('su-password').value = '';
            } catch (error) {
                errorMsg.classList.remove('hidden');
                errorMsg.textContent = error.response?.data?.error || 'Sign-up request failed. Please try again.';
            } finally {
                btn.disabled = false;
                spinner.classList.add('hidden');
            }
        }

        // Auto-select Sign-Up tab if ?mode=signup query param present
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('mode') === 'signup') {
            switchAuthTab('signup');
        }
    </script>
</body>
</html>
